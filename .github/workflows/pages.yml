name: Build and deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out photographs and code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Restore processed-image cache
        uses: actions/cache@v4
        with:
          path: |
            .cache
            dist/media
          key: portfolio-images-${{ runner.os }}-${{ hashFiles('photos/**', 'scripts/lib/images.mjs', 'site.config.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            portfolio-images-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set GitHub Pages address
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY%/*}"
          repository="${GITHUB_REPOSITORY#*/}"
          if [ "${repository,,}" = "${owner,,}.github.io" ]; then
            echo "SITE_BASE_PATH=" >> "$GITHUB_ENV"
            echo "SITE_URL=https://${owner}.github.io" >> "$GITHUB_ENV"
          else
            echo "SITE_BASE_PATH=/${repository}" >> "$GITHUB_ENV"
            echo "SITE_URL=https://${owner}.github.io" >> "$GITHUB_ENV"
          fi

      - name: Build and verify
        run: pnpm test

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
